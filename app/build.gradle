apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk 35
    defaultConfig {
        // Renamed from upstream's de.jl.notificationlog so this fork can be installed
        // alongside the upstream app. The Kotlin namespace stays at de.jl.notificationlog
        // so we don't have to move 40+ source files.
        applicationId "pl.d33.notificationlog.ntfy"
        minSdkVersion 21
        targetSdkVersion 34
        // CI workflow stamps these from git rev-list count and git describe; local
        // builds fall back to the upstream values for parity.
        versionCode (System.getenv("VERSION_CODE")?.toInteger() ?: 22)
        versionName System.getenv("VERSION_NAME") ?: "1.21"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }
    }
    buildFeatures {
        dataBinding true
    }
    signingConfigs {
        release {
            def ks = System.getenv("RELEASE_KEYSTORE")
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    namespace 'de.jl.notificationlog'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.10"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'androidx.room:room-runtime:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.paging:paging-runtime:3.3.6'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    // HTTP webhook delivery (offline-resilient via WorkManager constraints + backoff)
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.work:work-testing:2.10.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'

    androidTestImplementation 'androidx.work:work-testing:2.10.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}